<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lock Screen</title>
    
    <style>
        :root {
          /* 間諜低調配色：深海藍與炭灰 */
          --ios-blur: blur(35px);
          --ios-bg: rgba(15, 15, 20, 0.85); 
          --text-main: rgba(255, 255, 255, 0.95);
          --text-sub: rgba(235, 235, 245, 0.6);
        }

        body {
          background: #000;
          margin: 0; padding: 0;
          width: 100vw; height: 100vh;
          display: flex; justify-content: center; align-items: center;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
          overflow: hidden;
        }

        .iphone {
          width: 100%; height: 100%;
          position: relative; overflow: hidden;
          display: flex; flex-direction: column; align-items: center;
          background: #000;
        }

        @media (min-width: 500px) {
          .iphone {
            width: 390px; height: 844px;
            border: 10px solid #2c2c2e;
            border-radius: 50px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
          }
        }

        /* 改用 iOS 18 風格的深藍灰漸層桌布 */
        .wallpaper {
          position: absolute; inset: 0;
          background: 
            radial-gradient(circle at 20% 30%, #2c3e50 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, #000000 0%, transparent 50%),
            linear-gradient(135deg, #1a1a2e 0%, #0f0f0f 100%);
          background-size: cover;
          z-index: 0;
        }

        .lock-screen-info {
          position: relative; z-index: 10;
          color: var(--text-main);
          text-align: center;
          margin-top: calc(110px + env(safe-area-inset-top));
          text-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .date { font-size: 22px; font-weight: 500; margin-bottom: 8px; letter-spacing: -0.2px; }
        .time { font-size: 105px; font-weight: 700; margin: 0; letter-spacing: -4px; line-height: 1; }

        /* 通知：更深的毛玻璃感 */
        .ios-notification {
          position: absolute; bottom: -200px;
          left: 14px; right: 14px;
          background: var(--ios-bg);
          backdrop-filter: var(--ios-blur);
          -webkit-backdrop-filter: var(--ios-blur);
          border-radius: 26px;
          padding: 18px;
          opacity: 0;
          transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
          box-shadow: 0 10px 40px rgba(0,0,0,0.4);
          z-index: 100;
          border: 0.5px solid rgba(255,255,255,0.08);
        }

        .ios-notification.active {
          bottom: calc(120px + env(safe-area-inset-bottom, 35px));
          opacity: 1;
        }

        .noti-header {
          display: flex; justify-content: space-between;
          align-items: center; margin-bottom: 6px;
        }

        .app-info { display: flex; align-items: center; gap: 10px; }
        .app-icon { 
            width: 22px; height: 22px; 
            background: linear-gradient(135deg, #3a3a3c, #1c1c1e);
            border-radius: 6px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .app-name { font-size: 13px; font-weight: 600; color: var(--text-sub); letter-spacing: 0.5px; }
        .noti-time { font-size: 12px; color: var(--text-sub); opacity: 0.8; }

        .noti-body strong { display: block; font-size: 16px; color: #fff; margin-top: 2px; font-weight: 600; }
        .noti-body p { margin: 4px 0 0; font-size: 15px; color: #d1d1d6; line-height: 1.4; }

        .bottom-bar {
          position: absolute;
          bottom: calc(50px + env(safe-area-inset-bottom, 35px));
          width: 100%;
          display: flex; justify-content: space-around; align-items: center;
          z-index: 10;
        }

        .circle-btn {
          width: 52px; height: 52px;
          background: rgba(255,255,255,0.08);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-radius: 50%;
          display: flex; justify-content: center; align-items: center;
          color: #fff; font-size: 20px;
          border: 0.5px solid rgba(255,255,255,0.05);
        }

        .unlock-indicator {
          position: absolute; bottom: -30px;
          width: 135px; height: 5px;
          background: rgba(255,255,255,0.3);
          border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="iphone">
        <div class="wallpaper"></div>
        
        <div class="lock-screen-info">
            <p class="date" id="current-date">--月--日 星期-</p>
            <h1 class="time" id="current-time">00:00</h1>
        </div>

        <div id="notification" class="ios-notification">
            <div class="noti-header">
                <div class="app-info">
                    <div class="app-icon">🔐</div>
                    <span class="app-name">MESSAGES</span>
                </div>
                <span class="noti-time">現在</span>
            </div>
            <div class="noti-body">
                <strong>未知號碼</strong>
                <p>東西準備好了，老地方見!</p>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="circle-btn">🔦</div>
            <div class="unlock-indicator"></div>
            <div class="circle-btn">📷</div>
        </div>
        
        <button id="triggerBtn" style="position:absolute; inset:0; width:100%; height:100%; opacity:0; z-index:999; cursor:pointer; border:none; background:transparent;"></button>
    </div>

    <script>
        const triggerBtn = document.getElementById('triggerBtn');
        const notification = document.getElementById('notification');

        triggerBtn.addEventListener('click', () => {
            notification.classList.toggle('active');
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
            
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('zh-TW', options);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
