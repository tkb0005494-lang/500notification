<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本資料調查表</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* 確保寬度包含 padding */
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>資料填寫</h2>
    <form id="google-form">
        <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="entry.1657705744" required>
        </div>

        <div class="form-group">
            <label for="university">就讀大學</label>
            <input type="text" id="university" name="entry.734592295" required>
        </div>

        <div class="form-group">
            <label for="department">科系</label>
            <input type="text" id="department" name="entry.1452511070" required>
        </div>

        <div class="form-group">
            <label for="grade">年級</label>
            <input type="text" id="grade" name="entry.1184283924" required>
        </div>

        <div class="form-group">
            <label for="phone">連絡電話</label>
            <input type="tel" id="phone" name="entry.762548578" required>
        </div>

        <button type="submit" id="submit-btn">送出表單</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const form = document.getElementById('google-form');
    const msg = document.getElementById('message');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        btn.disabled = true;
        btn.innerText = '處理中...';

        const formData = new FormData(form);
        const url = 'https://docs.google.com/forms/d/e/1FAIpQLSeJxG9VPd0bFtTVgFXg6ljTsTazeThFF48KHTOV9EU4f0thlA/formResponse';

        // 使用 no-cors 模式，因為 Google 表單不支援 CORS 回傳
        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        }).then(() => {
            msg.style.display = 'block';
            msg.style.color = 'green';
            msg.innerText = '感謝提交！資料已成功送出。';
            form.reset();
            btn.disabled = false;
            btn.innerText = '送出表單';
        }).catch(error => {
            msg.style.display = 'block';
            msg.style.color = 'red';
            msg.innerText = '提交失敗，請檢查網路連線。';
            btn.disabled = false;
            btn.innerText = '重試送出';
        });
    });
</script>

</body>
</html>
