<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Classified Intelligence</title>
    
    <style>
        :root {
          /* 間諜風格：深色半透明與冷色調模糊 */
          --ios-blur: blur(25px);
          --ios-bg: rgba(20, 20, 25, 0.75); 
          --text-main: #ffffff;
          --text-sub: #a0a0a5;
          --accent-color: #00ff41; /* 經典間諜綠色（可選） */
        }

        body {
          background: #000;
          margin: 0; padding: 0;
          width: 100vw; height: 100vh;
          display: flex; justify-content: center; align-items: center;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
          overflow: hidden;
        }

        .iphone {
          width: 100%; height: 100%;
          position: relative; overflow: hidden;
          display: flex; flex-direction: column; align-items: center;
          background: #000;
        }

        @media (min-width: 500px) {
          .iphone {
            width: 390px; height: 844px;
            border: 12px solid #222;
            border-radius: 55px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
          }
        }

        .wallpaper {
          position: absolute; inset: 0;
          /* 換成帶有科技感、暗黑數據風格的桌布 */
          background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                      url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1000&auto=format&fit=crop');
          background-size: cover;
          background-position: center;
          z-index: 0;
          filter: brightness(0.7) contrast(1.1);
        }

        .lock-screen-info {
          position: relative; z-index: 10;
          color: var(--text-main);
          text-align: center;
          margin-top: calc(90px + env(safe-area-inset-top));
          text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .date { font-size: 21px; font-weight: 500; margin-bottom: 5px; opacity: 0.9; }
        .time { font-size: 100px; font-weight: 700; margin: 0; letter-spacing: -2px; }

        /* 間諜風格通知：深色背景、簡約文字 */
        .ios-notification {
          position: absolute; bottom: -200px;
          left: 12px; right: 12px;
          background: var(--ios-bg);
          backdrop-filter: var(--ios-blur);
          -webkit-backdrop-filter: var(--ios-blur);
          border-radius: 22px;
          padding: 16px;
          opacity: 0;
          transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
          box-shadow: 0 15px 35px rgba(0,0,0,0.5);
          z-index: 100;
          border: 0.5px solid rgba(255,255,255,0.1);
        }

        .ios-notification.active {
          bottom: calc(115px + env(safe-area-inset-bottom, 25px));
          opacity: 1;
        }

        .noti-header {
          display: flex; justify-content: space-between;
          align-items: center; margin-bottom: 6px;
        }

        .app-info { display: flex; align-items: center; gap: 8px; }
        .app-icon { font-size: 16px; filter: grayscale(1); } /* 讓圖示變灰 */
        .app-name { font-size: 12px; font-weight: 600; color: var(--text-sub); letter-spacing: 1px; }
        .noti-time { font-size: 11px; color: var(--text-sub); opacity: 0.6; }

        .noti-body strong { display: block; font-size: 16px; color: var(--text-main); margin-top: 2px; }
        .noti-body p { margin: 2px 0 0; font-size: 15px; color: var(--text-sub); line-height: 1.4; }

        .bottom-bar {
          position: absolute;
          bottom: calc(45px + env(safe-area-inset-bottom, 25px));
          width: 100%;
          display: flex; justify-content: space-around; align-items: center;
          z-index: 10;
        }

        .circle-btn {
          width: 52px; height: 52px;
          background: rgba(255,255,255,0.1);
          backdrop-filter: blur(15px);
          -webkit-backdrop-filter: blur(15px);
          border-radius: 50%;
          display: flex; justify-content: center; align-items: center;
          color: white; font-size: 20px;
        }

        .unlock-indicator {
          position: absolute; bottom: -25px;
          width: 135px; height: 5px;
          background: white; border-radius: 10px; opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="iphone">
        <div class="wallpaper"></div>
        
        <div class="lock-screen-info">
            <p class="date" id="current-date">--月--日 星期-</p>
            <h1 class="time" id="current-time">00:00</h1>
            <div style="font-size: 12px; margin-top: 10px; opacity: 0.5; letter-spacing: 2px;">ENCRYPTED LINE</div>
        </div>

        <div id="notification" class="ios-notification">
            <div class="noti-header">
                <div class="app-info">
                    <div class="app-icon">📡</div>
                    <span class="app-name">MESSAGES</span>
                </div>
                <span class="noti-time">現在</span>
            </div>
            <div class="noti-body">
                <strong>未知號碼</strong>
                <p>東西準備好了。今晚 23:00 老地方見，讀完即焚。</p>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="circle-btn">🔦</div>
            <div class="unlock-indicator"></div>
            <div class="circle-btn">📷</div>
        </div>
        
        <button id="triggerBtn" style="position:absolute; inset:0; width:100%; height:100%; opacity:0; z-index:999; cursor:pointer; border:none; background:transparent;"></button>
    </div>

    <script>
        const triggerBtn = document.getElementById('triggerBtn');
        const notification = document.getElementById('notification');

        triggerBtn.addEventListener('click', () => {
            notification.classList.toggle('active');
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
            
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('zh-TW', options);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
